name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Pint + PHPStan + Rector)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v4

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Rector
        run: vendor/bin/rector process --dry-run --no-progress-bar

  tests:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / Guzzle ${{ matrix.guzzle }}${{ matrix.dependencies == 'lowest' && ' (lowest)' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Laravel 12 requires PHP >= 8.2, Laravel 13 requires PHP >= 8.3.
        # This package requires PHP >= 8.3, so every pair below is valid.
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        guzzle: ['7', '8']
        dependencies: ['highest']
        include:
          - { php: '8.3', laravel: '12', guzzle: '7', dependencies: 'lowest' }

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Pin Laravel and Guzzle versions
        run: |
          composer require --no-update --no-interaction \
            "illuminate/mail:^${{ matrix.laravel }}.0" \
            "illuminate/notifications:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0" \
            "guzzlehttp/guzzle:^${{ matrix.guzzle }}.0"
          composer require --dev --no-update --no-interaction \
            "illuminate/container:^${{ matrix.laravel }}.0" \
            "illuminate/filesystem:^${{ matrix.laravel }}.0"

      - name: Install dependencies
        uses: ramsey/composer-install@v4
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: --prefer-dist

      - name: Show resolved versions
        run: composer show illuminate/mail guzzlehttp/guzzle phpunit/phpunit symfony/mailer 2>/dev/null | grep -E '^(name|versions)' || composer show --direct

      - name: Run tests
        run: vendor/bin/phpunit
